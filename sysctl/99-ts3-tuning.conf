# TS3 服务器调优（2026-09-15）—— 小内存云主机 + 跨洋语音/音频流
### 内存
# 机器人常驻内存，别被换出去（原来 68MB 被换出导致缺页 I/O）
vm.swappiness = 10
# 保留 dentry/inode 缓存（服务器场景收益大）
vm.vfs_cache_pressure = 50
# 减小写回突发，避免小盘上的延迟尖峰
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

### 网络（跨太平洋链路）
# BBR 在长肥管道/有丢包的链路上显著优于 cubic —— 本机最主要的一条优化
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
# 空闲后别把拥塞窗口清零（音频流常是"停一会再传"）
net.ipv4.tcp_slow_start_after_idle = 0
# 公网端口，抗 SYN 洪
net.ipv4.tcp_max_syn_backlog = 1024
# TCP Fast Open（客户端+服务端）
net.ipv4.tcp_fastopen = 3
# 自动探测 PMTU，绕开跨洋链路的 MTU 黑洞
net.ipv4.tcp_mtu_probing = 1
# 音视频流的抖动缓冲
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608
net.core.netdev_max_backlog = 5000
